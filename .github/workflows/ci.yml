name: verified source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -c constraints.txt '.[dev]'
      - run: ruff check src research ops tests migrations fixtures
      - run: mypy --strict src/eventdesk
      - run: python ops/secret_scan.py
      - run: pytest -q -s
      - run: docker compose up --build -d
      - run: python fixtures/smoke.py
      - run: docker compose exec -T api python fixtures/receipt_concurrency.py
      - run: docker compose exec -T api python fixtures/source_concurrency.py
      - if: always()
        run: docker compose down
