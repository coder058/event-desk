# SOURCE: HAProxy 3.2 manual, TCP ClientHello and predefined HTTP ACL.
# This proxy does not decrypt TLS or log HTTP content/headers. Caddy retains TLS keys.
global
    # GUESS: initial connection ceiling; not a measured optimum. # UNCALIBRATED GUESS
    maxconn 512
defaults
    mode tcp
    # GUESS: operational timeouts, separate from the durable event deadline. # UNCALIBRATED GUESS
    timeout connect 5s
    timeout client 30s
    timeout server 30s
frontend shared_port
    # SOURCE: existing externally accessible HTTP port, reused for TLS as well.
    bind :80
    # SOURCE: documented HAProxy sample's bounded ClientHello inspection budget.
    # It admits a complete ClientHello or HTTP request immediately, not after five seconds.
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    tcp-request content accept if HTTP
    use_backend encrypted if { req.ssl_hello_type 1 }
    default_backend cleartext
backend encrypted
    # SOURCE: Caddy's existing HTTPS listener; certificate verification stays at the client.
    server caddy caddy:443
backend cleartext
    # GUESS: private alternate HTTP listener, keeping ACME HTTP-01 available on public 80.
    # UNCALIBRATED GUESS: port choice, not performance calibration.
    server caddy caddy:8080
