# GUESS: bounded local log retention, not an observed optimum. # UNCALIBRATED GUESS
x-local-logging: &local-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  db:
    logging: *local-logging
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: /etc/eventdesk/database.env
    volumes: ["production-db:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "statement_timeout=10000"] # GUESS: guard below official ACK limit.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventdesk -d eventdesk"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m # UNCALIBRATED GUESS: operational resource budget; verify on this VPS.
  migrate:
    logging: *local-logging
    build: .
    env_file: /etc/eventdesk/runtime.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    logging: *local-logging
    build: .
    restart: unless-stopped
    env_file: [/etc/eventdesk/env, /etc/eventdesk/runtime.env]
    ports: ["127.0.0.1:8800:8000"] # SOURCE: loopback-only origin for authenticated local SSH preview.
    volumes: ["/var/lib/eventdesk/models:/models:ro"]
    mem_limit: 256m # UNCALIBRATED GUESS: measure real RSS and ACK behavior.
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    logging: *local-logging
    build: .
    restart: unless-stopped
    env_file: [/etc/eventdesk/env, /etc/eventdesk/runtime.env]
    environment:
      # SOURCE: initial preregistration permits post-submission evidence, never a prediction-affecting blend.
      EVENTDESK_LLM_ENABLED: "true"
      EVENTDESK_BLEND_PATH: ""
    command: ["python", "-m", "eventdesk.worker"]
    volumes: ["/var/lib/eventdesk/models:/models:ro"]
    mem_limit: 512m # UNCALIBRATED GUESS: fitted sparse model plus shared I/O workers.
    depends_on:
      migrate: {condition: service_completed_successfully}
  caddy:
    logging: *local-logging
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["443:443"] # SOURCE: standard HTTPS stays available when the existing cloud rule is restored.
    volumes: ["./ops/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on: [api]
    mem_limit: 128m # UNCALIBRATED GUESS: existing VPS operational budget.
  ingress:
    logging: *local-logging
    # SOURCE: Docker official HAProxy 3.2 image, exact digest retained in the loopback probe report.
    image: haproxy@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    restart: unless-stopped
    ports: ["80:80"] # SOURCE: already accessible public listener; TLS remains terminated by Caddy.
    volumes: ["./ops/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    depends_on: [caddy]
    mem_limit: 64m # GUESS: operational memory ceiling, not a measured capacity. # UNCALIBRATED GUESS
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  official-observer:
    logging: *local-logging
    build: .
    restart: unless-stopped
    env_file: [/etc/eventdesk/env, /etc/eventdesk/runtime.env]
    command: ["python", "-m", "eventdesk.competition"]
    mem_limit: 128m # GUESS: isolated metadata collector; measure RSS. # UNCALIBRATED GUESS
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  production-db:
  caddy-data:
  caddy-config:
